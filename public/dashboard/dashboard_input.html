<!DOCTYPE html>
<html lang="pt_br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inserção de Dados da partida</title>
    <link rel="stylesheet" href="../css/dashboard_input.css">
</head>
<body>
    
<a class="botao-voltar" href="../index.html" aria-label="Voltar para a página inicial" title="Voltar para a página inicial">&larr;</a>



<div class="conteudo-dashboard">
    <h1>Bem Vindo a Dashboard de Análise da Partida jogada</h1>
    <h2>Insira os Dados da partida jogada</h2>
    <h3>Selecione o Mapa Jogado:</h3>
    <select id="mapa" required onchange="mostrarImagemMapa()">
        <option value="" disabled selected>Selecione o mapa jogado</option>
        <option value="mirage">Mirage</option>
        <option value="dust">Dust2</option>
        <option value="nuke">Nuke</option>
        <option value="inferno">Inferno</option>
        <option value="anubis">Anubis</option>
        <option value="cache">Cache</option>
        <option value="ancient">Ancient</option>
        <option value="cobblestone">Cobblestone (novo)</option>
    </select>

    <img id="imagemMapa" alt="Prévia do mapa selecionado" hidden>
    <br><br><br>
    Jogou com Amigos ou Solo?
    <select id="jogouComAmigos" required onchange="mostrarCampoNickname()"> 
        <option value="" disabled selected>Selecione uma opção</option>
        <option value="amigos">Com Amigos</option>
        <option value="solo">Solo</option>
    </select>

    <div id="campoNickname" hidden>
        <label for="nicknameAmigo">Nickname do amigo:</label>
        <input type="text" id="nicknameAmigo" placeholder="Digite o nickname">
        <br><br>
    </div>

    <section>
        <h3>Suas estatísticas da partida</h3>
        <div>
            <label for="eliminacoesUsuario">Suas eliminações</label><br>
            <input type="number" id="eliminacoesUsuario" min="0" step="1"><br>
        </div>
        <div>
            <label for="taxaHsUsuario">Sua taxa de HS (%)</label> <br>
            <input type="number" id="taxaHsUsuario" min="0" max="100" step="1"><br>
        </div>
        <div>
            <label for="mortesUsuario">Suas mortes</label> <br>
            <input type="number" id="mortesUsuario" min="0" step="1"><br>
        </div>
        <div>
            <label for="danoUsuario">Seu dano total causado</label><br>
            <input type="number" id="danoUsuario" min="0" step="1"><br>
            <br>
        </div>
    </section>

    <section id="estatisticasAmigo" hidden>
        <h3>Estatísticas do amigo</h3>
        <div>
            <label for="eliminacoesAmigo">Eliminações do amigo</label> <br>
            <input type="number" id="eliminacoesAmigo" min="0" step="1"><br>
        </div>
        <div>
            <label for="taxaHsAmigo">Taxa de HS do amigo (%)</label><br>
            <input type="number" id="taxaHsAmigo" min="0" max="100" step="1"><br>
        </div>
        <div>
            <label for="mortesAmigo">Mortes do amigo</label><br>
            <input type="number" id="mortesAmigo" min="0" step="1"><br>
        </div>
        <div>
            <label for="danoAmigo">Dano total causado pelo amigo</label> <br>
            <input type="number" id="danoAmigo" min="0" step="1"><br><br>
            <br>
        </div>
    </section>

    <button class="botao-aceitar" onclick="aceitar()">ACEITAR</button>
    
</div>

<div id="videoOverlay" class="video-overlay" hidden>
    <video id="videoAceitar" playsinline>
        <source src="../assets/video_aceitar/aceitar_final.mp4" type="video/mp4">
    </video>
</div>

<script>

    /*APRENDIZADO:
    USANDO A FUNÇÃO video overlay para o video "saltar na tela (dica do leo), e escurecer o fundo, api nativa de videos do javascript " */

    let enviandoPartida = false;
    let partidaSalva = false;
    let videoFinalizado = false;
    let videoFalhou = false;
    let redirecionamentoIniciado = false;

    function redirecionarDashboardQuandoPronto() {
        if (partidaSalva && videoFinalizado && !redirecionamentoIniciado) {
            redirecionamentoIniciado = true;
            if (videoFalhou) {
                alert("A partida foi salva, mas o vídeo não pôde ser reproduzido.");
            }
            window.location.href = "dashboard.html";
        }
    }

    function aceitar() {
        if (enviandoPartida) {
            return;
        }

        if (!sessionStorage.ID_USUARIO) {
            alert("Faça login para salvar os dados da partida.");
            window.location.href = "../login.html";
            return;
        }

        let comAmigos = jogouComAmigos.value === "amigos";
        let nickname = nicknameAmigo.value.trim();
        let dadosValidos = Boolean(mapa.value && jogouComAmigos.value);
        let camposInvalidos = [];

        if (!mapa.value) {
            camposInvalidos.push("mapa");
        }

        if (!jogouComAmigos.value) {
            camposInvalidos.push("modo da partida");
        }

        function validarNumeroInteiro(campo, nome) {
            let valido = campo.value !== ""
                && campo.checkValidity()
                && Number.isInteger(campo.valueAsNumber);

            if (!valido) {
                camposInvalidos.push(nome);
                dadosValidos = false;
            }
        }

        validarNumeroInteiro(eliminacoesUsuario, "suas eliminações");
        validarNumeroInteiro(taxaHsUsuario, "sua taxa de HS");
        validarNumeroInteiro(mortesUsuario, "suas mortes");
        validarNumeroInteiro(danoUsuario, "seu dano");

        if (comAmigos) {
            if (nickname[0] !== "@" || nickname.indexOf("@", 1) !== -1 || nickname.length === 1) {
                dadosValidos = false;
                camposInvalidos.push("nickname do amigo (comece com um único @)");
            }

            validarNumeroInteiro(eliminacoesAmigo, "eliminações do amigo");
            validarNumeroInteiro(taxaHsAmigo, "taxa de HS do amigo");
            validarNumeroInteiro(mortesAmigo, "mortes do amigo");
            validarNumeroInteiro(danoAmigo, "dano do amigo");
        }

        if (!dadosValidos) {
            alert(
                "Confira estes campos: " + camposInvalidos.join(", ")
                + ". Use números inteiros não negativos; a taxa de HS deve ficar entre 0 e 100."
            );
        } else {
            let partida = {
                idUsuario: Number(sessionStorage.ID_USUARIO),
                mapa: mapa.value,
                jogouComAmigos: comAmigos ? "amigos" : "solo",
                nicknameAmigo: comAmigos ? nickname : null,
                eliminacoesUsuario: Number(eliminacoesUsuario.value),
                taxaHsUsuario: Number(taxaHsUsuario.value),
                mortesUsuario: Number(mortesUsuario.value),
                danoUsuario: Number(danoUsuario.value),
                eliminacoesAmigo: comAmigos ? Number(eliminacoesAmigo.value) : null,
                taxaHsAmigo: comAmigos ? Number(taxaHsAmigo.value) : null,
                mortesAmigo: comAmigos ? Number(mortesAmigo.value) : null,
                danoAmigo: comAmigos ? Number(danoAmigo.value) : null
            };

            enviandoPartida = true;
            partidaSalva = false;
            videoFinalizado = false;
            videoFalhou = false;
            redirecionamentoIniciado = false;

            videoOverlay.hidden = false;
            videoAceitar.currentTime = 0;
            videoAceitar.play().catch(function () {
                videoFalhou = true;
                videoFinalizado = true;
                videoOverlay.hidden = true;
                redirecionarDashboardQuandoPronto();
            });

            fetch("/partidas/cadastrar", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify(partida)
            })
                .then(function (resposta) {
                    return resposta.json().then(function (dados) {
                        if (!resposta.ok) {
                            throw new Error(dados.message || "Não foi possível salvar a partida.");
                        }
                        return dados;
                    });
                })
                .then(function () {
                    partidaSalva = true;
                    redirecionarDashboardQuandoPronto();
                })
                .catch(function (erro) {
                    videoAceitar.pause();
                    videoOverlay.hidden = true;
                    enviandoPartida = false;
                    alert("Não foi possível salvar os dados: " + erro.message);
                });
        }
    }

    function mostrarCampoNickname() {
        if (jogouComAmigos.value === "amigos") {       // se escolheu a opc amigos mostra o campo para digitar o nick do amigo 
            campoNickname.hidden = false;
            estatisticasAmigo.hidden = false;
        } else {
            campoNickname.hidden = true;
            estatisticasAmigo.hidden = true;
            nicknameAmigo.value = "";
            eliminacoesAmigo.value = "";
            taxaHsAmigo.value = "";
            mortesAmigo.value = "";
            danoAmigo.value = "";
        }
    }

    videoAceitar.addEventListener("ended", function () {           // espera o video terminar com escutar o evendo ended de acabr video, ai puxa a função como vazia q representa apenas o camada de video da página desaparecendo 
        videoOverlay.hidden = true;
        videoFinalizado = true;
        redirecionarDashboardQuandoPronto();
    });

    function mostrarImagemMapa() {
        let valoresMapas = [
            "mirage",
            "dust",                               /*UTILIZANDO VETOR PARA ARMAZENAR LISTA DOS MAPAS */
            "nuke",
            "inferno",
            "anubis",
            "cache",
            "ancient",
            "cobblestone"
        ];
        let caminhosImagens = [
            "../assets/mapas/de_mirage.webp",                   /*mirage */
            "../assets/mapas/csgo-dust-2-map.avif",                      /*dust2 */
            "../assets/mapas/1296339-vertical-nuke-hd-wallpaper-1920x1080-for-ipad.jpg",              /*nuke */          
            "../assets/mapas/cs-2-inferno.jpeg",                           /*inferno */
            "../assets/mapas/1067px-CS2_de_anubis.png",                    /*anubis */
            "../assets/mapas/mbwk627.jpeg",                                /*cache */
            "../assets/mapas/image_processing20251118-1-uu0e4l.webp",      /*ancient */
            "../assets/mapas/news-cs2-cobblestone-2026-1279.ed27c5cccf13dcd1.webp"  /*cobblestone */
        ];

        let encontrouImagem = false;

        for (let i = 0; i < valoresMapas.length; i++) {
            if (mapa.value === valoresMapas[i]) {
                imagemMapa.src = caminhosImagens[i];
                imagemMapa.alt = "Imagem do mapa " + valoresMapas[i];
                imagemMapa.hidden = false;   // não exibido ate percorrer a imagem e detectar seleção
                encontrouImagem = true;        
            }
        }

        if (!encontrouImagem) {
            imagemMapa.hidden = true;     // se não encontrar a imagem, esconder com o hidden sendo true 

            // aprendizado: o sinal de igual 3 vezes representa a comparação de valor e se a saida é boleana como true or false, senão se o exemplo utilizasse apenas dois iguais ele apenas diria > esse valor agr é tal , ou comparação absoluta 
        }
    }
</script>
</body>
</html>
